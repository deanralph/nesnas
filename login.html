<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NES-Inspired Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #cfcfcf;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
        }

        .login-container {
            background: #a0a0a0;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 4px 4px 0px #555;
            max-width: 400px;
            margin: 50px auto;
        }

        .nes-logo {
            font-size: 20px;
            color: #d82020;
            margin-bottom: 20px;
        }

        .form-control {
            background: #e0e0e0;
            border: 3px solid #555;
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
        }

        .btn-nes {
            background: #d82020;
            color: white;
            font-size: 14px;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 4px 4px 0px #555;
        }

        .btn-nes:hover {
            background: #a01010;
            box-shadow: 2px 2px 0px #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="nes-logo">NES.NAS 2000</div>
        <form method='POST'>
            <div class="mb-3">
                <input type="username" class="form-control" placeholder="Username">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Password">
            </div>
            <button type="submit" class="btn btn-nes">Start</button>
        </form>
    </div>
</body>
</html>
